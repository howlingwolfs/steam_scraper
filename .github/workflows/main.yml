name: Daily Steam Scraper

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows you to manually run the workflow from the Actions tab
  workflow_dispatch:

# Give permissions to push updated CSV back to the repository
permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Steam Scraper
        run: python steam_scraper.py

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add steam_games.csv
          # Prevent failure if no changes were found
          git diff --staged --quiet || git commit -m "Automated daily scrape update [skip ci]"
          git push
